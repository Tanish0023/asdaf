services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: gridbricks-backend
    ports:
      - "8000:8000"
    environment:
      - PYTHONUNBUFFERED=1
      - SQLITE_DB_PATH=/app/backend/data/wind_data.db
      - ELEXON_BASE_URL=https://data.elexon.co.uk/bmrs/api/v1
    volumes:
      - ./backend/data:/app/backend/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 3

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    container_name: gridbricks-frontend
    ports:
      - "3000:80"
    depends_on:
      - backend
    restart: unless-stopped
